services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: eventflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eventflow_local}
      MONGO_URL: mongodb://mongo:27017
      CASSANDRA_HOST: cassandra
      COOKIE_SECURE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: eventflow
      MYSQL_USER: eventflow
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eventflow_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: EventFlow
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cqlsh -e 'SELECT release_version FROM system.local' > /dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    restart: unless-stopped
volumes:
  mysql_data:
  mongo_data:
  cassandra_data:
