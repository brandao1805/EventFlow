services:
  mysql-web:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: mysql
    ports:
      - "127.0.0.1:8082:80"

  mongo-web:
    image: mongo-express:1.0.2
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "127.0.0.1:8081:8081"

  cassandra-web:
    build: ./cassandra-admin-ui
    environment:
      CA_CONNECTION_HOST: cassandra
    ports:
      - "127.0.0.1:8002:80"
    volumes:
      - ./cassandra-admin-ui/src:/app
      - ./cassandra-admin-ui/lib:/lualib