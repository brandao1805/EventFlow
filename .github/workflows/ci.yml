name: Testes EventFlow
on: [push, pull_request]
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 600
      - run: docker compose exec -T app npm run test:integration
      - if: always()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down -v
